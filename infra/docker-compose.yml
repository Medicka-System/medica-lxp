# ═══════════════════════════════════════════════════════════════════════════
# Campus Virtual LXP — Docker Compose LOCAL (Sprint 0)
# Levanta: postgres (pgvector), redis, api, worker, web. Todo con healthchecks.
# Traefik / Cloudflare Tunnel van en el sprint de producción (§11) — comentados.
# Uso:  docker compose -f infra/docker-compose.yml up -d
# Las variables se toman de ../.env (copia de .env.example).
# ═══════════════════════════════════════════════════════════════════════════

name: campus-lxp

services:
  postgres:
    # pgvector desde ya para no re-imagen en Sprint 1 (RAG · §3). Postgres 15.
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lxp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lxp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-campus_lxp}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lxp} -d ${POSTGRES_DB:-campus_lxp}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Redis propio del LXP, separado del de CORA/CRM (§3).
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  lrs:
    # SQL LRS de Yet Analytics (§3/§7): endpoint xAPI conformante y store de
    # registro de TODOS los eventos de aprendizaje. Backend SQLite local
    # autocontenido (su propio store, separado de la BD de la app · §7 "no reimplementar").
    image: yetanalytics/lrsql:latest
    restart: unless-stopped
    command: ['/lrsql/bin/run_sqlite.sh']
    environment:
      # Credencial (Basic auth) que usan api/worker para el endpoint xAPI.
      LRSQL_API_KEY_DEFAULT: ${LRS_KEY:-campuslxp}
      LRSQL_API_SECRET_DEFAULT: ${LRS_SECRET:-campuslxp_dev_secret}
      # Admin UI (inspección local).
      LRSQL_ADMIN_USER_DEFAULT: ${LRS_ADMIN_USER:-admin}
      LRSQL_ADMIN_PASS_DEFAULT: ${LRS_ADMIN_PASS:-campuslxp_admin}
      LRSQL_DB_NAME: /db/lrsql.sqlite.db
      LRSQL_ALLOW_ALL_ORIGINS: 'true'
    ports:
      - '${LRS_PORT:-8080}:8080'
    volumes:
      - lrs_db:/db

  minio:
    # Object storage local S3-compatible (§3/§9): MinIO en path-style, donde el
    # pipeline DICOM sube el estudio CRUDO y guarda el ANONIMIZADO. El `api` firma
    # (SigV4) y el binario va cliente↔MinIO directo — nunca por el `api` ni Postgres.
    # CORS abierto para que el navegador (subida) y el visor Cornerstone3D (lectura
    # con URL firmada) puedan hablar con MinIO en local.
    # quay.io es el registro oficial de MinIO (Docker Hub minio/minio suele estar
    # bloqueado / rate-limited sin login).
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-lxpminio}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-lxpminio_dev_secret}
      # Permite PUT (subida) y GET (visor wadouri) desde el navegador en local.
      MINIO_API_CORS_ALLOW_ORIGIN: '*'
    ports:
      - '${STORAGE_PORT:-9000}:9000' # API S3
      - '${STORAGE_CONSOLE_PORT:-9001}:9001' # Consola web (inspección local)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  createbuckets:
    # Init-container efímero: crea el bucket del pipeline una vez que MinIO responde
    # y lo deja listo. No queda corriendo (exit 0). Idempotente (mc mb --ignore-existing).
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY_ID:-lxpminio} ${STORAGE_SECRET_ACCESS_KEY:-lxpminio_dev_secret} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET:-campus-lxp-media} &&
      echo 'Bucket ${STORAGE_BUCKET:-campus-lxp-media} listo.'
      "
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: '8000'
      DATABASE_URL: postgresql://${POSTGRES_USER:-lxp}:${POSTGRES_PASSWORD:-lxp_dev_password}@postgres:5432/${POSTGRES_DB:-campus_lxp}
      REDIS_URL: redis://redis:6379
      # LRS (§7): api LEE del LRS; worker envía. Endpoint interno de la red compose.
      LRS_ENDPOINT: http://lrs:8080/xapi
      LRS_KEY: ${LRS_KEY:-campuslxp}
      LRS_SECRET: ${LRS_SECRET:-campuslxp_dev_secret}
      # Object storage (§3/§9): el `api` FIRMA subidas/lecturas contra MinIO. En la red
      # compose el endpoint interno es http://minio:9000 (ver .env para el modo híbrido:
      # con `pnpm dev` en host, STORAGE_ENDPOINT=http://localhost:9000 para que la URL
      # firmada apunte a un host que el navegador también alcance).
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-campus-lxp-media}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-lxpminio}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-lxpminio_dev_secret}
      # Eco (§7A): MOCK por default (sin API key). Cambiar ECO_PROVIDER=anthropic +
      # ANTHROPIC_API_KEY enchufa el modelo real sin tocar código. Modelos por paso
      # salen de lxp.eco_config; estas envs son solo el interruptor de proveedor.
      ECO_PROVIDER: ${ECO_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # RAG: servicio de embeddings self-hosted (BGE-M3 · §3), red interna del compose.
      EMBEDDINGS_URL: http://embeddings:8001
    ports:
      - '${API_PORT:-8000}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lrs:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-lxp}:${POSTGRES_PASSWORD:-lxp_dev_password}@postgres:5432/${POSTGRES_DB:-campus_lxp}
      REDIS_URL: redis://redis:6379
      # LRS (§7): el worker `envio-xapi` POSTea aquí los statements con retry.
      LRS_ENDPOINT: http://lrs:8080/xapi
      LRS_KEY: ${LRS_KEY:-campuslxp}
      LRS_SECRET: ${LRS_SECRET:-campuslxp_dev_secret}
      # Eco (§8): `indexar-rag` embebe contra el servicio local; `eco-evaluacion`
      # dispara el lote llamando al `api` (el juicio vive en api/src/ai · §4).
      EMBEDDINGS_URL: http://embeddings:8001
      API_URL: http://api:8000
      # Redactor de PII quemada en píxeles (§10): `procesar-dicom` manda cada `.dcm`
      # tag-limpio a Presidio para tapar el nombre del paciente antes de subir.
      REDACTOR_URL: ${REDACTOR_URL:-http://redactor-dicom:8002}
      # Object storage (§3/§9): `procesar-dicom` LEE el crudo, ESCRIBE el anonimizado
      # y BORRA el crudo con las URLs firmadas que el `api` mete en el job (el worker
      # no firma). Necesita alcanzar MinIO por la red compose (http://minio:9000).
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-campus-lxp-media}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-lxpminio}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-lxpminio_dev_secret}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      lrs:
        condition: service_started
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      redactor-dicom:
        condition: service_healthy

  embeddings:
    # BGE-M3 self-hosted (§3): embeddings multilingües LOCALES para el RAG de Eco
    # (nada de API de terceros · latencia). El worker `indexar-rag` y el api lo usan.
    build:
      context: ../services/embeddings
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-BAAI/bge-m3}
      EMBEDDINGS_DEVICE: cpu
    ports:
      - '${EMBEDDINGS_PORT:-8001}:8001'
    volumes:
      # Cachea el modelo descargado (~2 GB) para no rebajarlo en cada arranque.
      - embeddings_models:/models
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8001/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  redactor-dicom:
    # Redactor de PII QUEMADA en píxeles (§10): Presidio (OCR Tesseract + NER spaCy es)
    # tapa SOLO la caja del nombre del paciente. ON-PREM (nunca a la nube). El worker
    # `procesar-dicom` lo llama tras limpiar los tags (REDACTOR_URL).
    build:
      context: ../services/redactor-dicom
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REDACTOR_SPACY_MODEL: ${REDACTOR_SPACY_MODEL:-es_core_news_lg}
      REDACTOR_OCR_LANG: ${REDACTOR_OCR_LANG:-spa+eng}
      REDACTOR_SCORE: ${REDACTOR_SCORE:-0.4}
    ports:
      - '${REDACTOR_PORT:-8002}:8002'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8002/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Lectura con RLS desde server components (Sprint 4; se reemplaza por el
      # cliente Supabase en el Sprint 11). Conecta al Postgres de la red compose.
      DATABASE_URL: postgresql://${POSTGRES_USER:-lxp}:${POSTGRES_PASSWORD:-lxp_dev_password}@postgres:5432/${POSTGRES_DB:-campus_lxp}
      # Alumno "logueado" de dev hasta el auth real del Sprint 11.
      DEV_ALUMNO_EMAIL: ${DEV_ALUMNO_EMAIL:-a1@seed.local}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Producción (§11) — se habilitan en el Sprint 10, no en local ──
  # traefik:
  #   image: traefik:v3
  #   ...
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   command: tunnel run
  #   ...

volumes:
  pg_data:
  redis_data:
  lrs_db:
  embeddings_models:
  minio_data:
